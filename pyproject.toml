[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iothing-auth"
version = "0.1.0"
description = "Shared accounts, sessions, roles and per-user settings for the ioThing apps (ioPix, ioNotes, ioContacts)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymysql<2",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
]

[project.optional-dependencies]
fastapi = ["fastapi<1"]
test = ["pytest<10", "httpx<1", "fastapi<1"]

[project.scripts]
iothing-auth = "iothing_auth.cli:main"

[tool.setuptools.packages.find]
include = ["iothing_auth*"]
