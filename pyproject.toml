[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iosuite-shared"
version = "0.18.3"
description = "Shared accounts, sessions, roles and per-user settings for the ioThing apps (ioPix, ioNotes, ioCalendar, ioContacts, ioHealth, ioSuite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pymysql<2",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
]

[project.optional-dependencies]
fastapi = ["fastapi<1"]
test = ["pytest<10", "httpx<1", "fastapi<1", "mcp<3", "pyflakes<4"]

[project.scripts]
iosuite-shared = "iosuite_shared.cli:main"

[tool.setuptools.packages.find]
include = ["iosuite_shared*"]
